</head>
<body>
	<h1>Mijn Portfolio</h1>

	<nav>
		<img src="ds-initial-letter-logo-design_1200281-6527.jpg.avif" alt="Logo" class="logo">

		</ul>

	<main class="contact-page">
		<section class="contact-intro">
			<h2>Neem contact op</h2>
			<p>Vul het formulier in als je contact met mij wilt opnemen.</p>  
		</section>

		<form class="contact-form">
			<fieldset>
				<legend>Jouw gegevens</legend>

				<div class="form-field">
					<label for="fname">Voornaam</label>
					<input type="text" id="fname" name="fname" autocomplete="given-name" required>
				</div>

				<div class="form-field">
					<label for="lname">Achternaam</label>
					<input type="text" id="lname" name="lname" autocomplete="family-name" required>
				</div>

				<div class="form-field">
					<label for="email">E-mailadres</label>
					<input type="email" id="email" name="email" autocomplete="email" required>
				</div>

				<div class="form-field">
					<label for="message">Waarom neem je contact op?</label>
					<textarea id="message" name="message" rows="6" required></textarea>
				</div>

				<button type="submit">Versturen</button>
			</fieldset>
		</form>
	</main>
